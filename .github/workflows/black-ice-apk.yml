name: Black Ice 1.0.4 full integration APK

on:
  push:
    branches: [black-ice-1.0.4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: black-ice-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    defaults:
      run:
        working-directory: platforms/android

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Verify Black Ice integration
        working-directory: .
        run: |
          node black-ice/tests/library-ui.cjs
          python3 black-ice/tests/integration.py

      - name: Fetch shader compiler dependencies
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust target
        run: rustup target add aarch64-linux-android

      - name: Create disposable test signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Black Ice Test"

      - name: Apply Snapdragon 662 performance preset
        run: python3 tools/apply-black-ice-sd662-tune.py

      - name: Build universal 4K and 16K test APK
        run: bash tools/build-universal-page-apk.sh "$GITHUB_WORKSPACE/Black-Ice-1.0.4-test.apk"

      - name: Freeze and verify APK
        run: |
          ./gradlew --stop || true
          cp "$GITHUB_WORKSPACE/Black-Ice-1.0.4-test.apk" "$GITHUB_WORKSPACE/Black-Ice-1.0.4-install.apk"
          unzip -t "$GITHUB_WORKSPACE/Black-Ice-1.0.4-install.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/Black-Ice-1.0.4-install.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$GITHUB_WORKSPACE/Black-Ice-1.0.4-install.apk"
          sha256sum "$GITHUB_WORKSPACE/Black-Ice-1.0.4-install.apk"

      - name: Upload verified installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Ice-1.0.4-verified
          path: Black-Ice-1.0.4-install.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
