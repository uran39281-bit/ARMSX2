function details(){const g=current();if(!g)return empty();return `<section class="page"><button class="back" data-page="library">← Back to library</button><div class="detail"><div class="eyebrow">YOUR FILE · ${esc(kind(g))}</div><h1>${esc(g.title)}</h1><div class="actions"><button class="primary" data-action="play">▶ Play</button><button class="secondary" data-action="favorite">${favorites.has(g.id)?'★ Favorited':'☆ Add favorite'}</button></div><div class="details-grid">${[['Play time',duration(g.playMs)],['Last session',duration(g.lastSessionMs)],['File size',formatSize(g.size)],['Added',date(g.added)],['Last launch request',date(g.lastLaunch)],['Format',kind(g)]].map(([k,v])=>`<div class="metric"><label>${k}</label><strong>${esc(v)}</strong></div>`).join('')}</div><div class="cover-note">Cover serial: <span data-cover-serial>${esc(g.coverSerial||'Not identified')}</span> · <span data-cover-status>${esc(g.coverState||'Waiting for cover')}</span></div><div class="metric" style="margin-top:16px"><label>Filename</label><strong style="overflow-wrap:anywhere">${esc(g.filename)}</strong></div><p style="color:#8e9fb7;max-width:620px;font-size:13px;margin-top:24px">The built-in ARMSX2 core handles emulation, BIOS, controls and save states. Complete Emulator setup with your own PS2 BIOS first.</p><p class="tracking-note">Playtime counts RUNNING VM intervals for games opened here. Paused and background time are excluded. ${trackingOn?'Tracking enabled.':'Tracking starts when the built-in VM is running.'}</p>${infoBlock(g)}<div class="actions"><button class="secondary" data-action="emulator">Emulator setup</button><button class="secondary" data-action="membership">Add to playlist</button><button class="secondary" data-action="choosecover">Match game / cover</button><button class="secondary" data-action="remove">Remove from library</button></div></div></section>`}

function settings(){return `<section class="page"><h1>Settings</h1><div class="settings"><aside class="sidebar"><button class="on">Library & interface</button></aside><div class="setting-content"><h2>Black Ice</h2>${extraSettings()}<div class="setting-row"><div><h3>Black Ice Theme</h3><p>Loop your theme song on the Home screen. It pauses when you enter a game or leave the app.</p></div><button class="toggle" role="switch" aria-label="Black Ice Theme" aria-checked="${themeOn}" data-action="theme"></button></div><div class="setting-row"><div><h3>Playtime tracking</h3><p>${esc(trackingStatus)}. Tracks the built-in VM without Android Usage Access.</p></div><button class="secondary small-action" data-action="tracking">${trackingOn?'Tracking information':'Tracking information'}</button></div><div class="setting-row"><div><h3>Add Games</h3><p>Select files using Android’s system file picker. Long-press a file there to select multiple files.</p></div><button class="secondary" data-action="add">Browse files</button></div><div class="setting-row"><div><h3>Black Ice emulator</h3><p>Set up BIOS, emulation, graphics, controllers, and save states in the emulator.</p></div><button class="secondary" data-action="emulator">Open emulator</button></div><div class="setting-row"><div><h3>Automatic cover downloads</h3><p>Find matching covers from xlenore/ps2-covers when games are added. Downloads are cached for offline use.</p></div><button class="toggle" role="switch" aria-label="Automatic cover downloads" aria-checked="${autoCovers}" data-action="autocovers"></button></div><div class="setting-row"><div><h3>Download missing covers</h3><p>Retry missing artwork for your existing files. Choose a cover match in File Details if needed.</p></div><button class="secondary" data-action="downloadcovers">Download covers</button></div><div class="setting-row"><div><h3>Automatic game information</h3><p>Download GameDB-PS2 metadata and short factual descriptions. Information is cached offline.</p></div><button class="toggle" role="switch" aria-label="Automatic game information" aria-checked="${infoAuto}" data-action="autoinfo"></button></div><div class="setting-row"><div><h3>Refresh game descriptions</h3><p>Update the cached database. Match a game serial in File Details if its information is missing.</p></div><button class="secondary small-action" data-action="downloadinfo">Download info</button></div><div class="setting-row"><div><h3>Reduce Motion</h3><p>Use short transitions while keeping focus visible.</p></div><button class="toggle" role="switch" aria-label="Reduce Motion" aria-checked="${!!prefs.reduced}" data-action="motion"></button></div><div class="setting-row"><div><h3>File access</h3><p>Only files you select are added. Removing a library entry does not delete the original file.</p></div></div><div class="setting-row"><div><h3>About this app</h3><p>A standalone PS2 emulator built on ARMSX2 / PCSX2. Version 1.0 · Built-in ARMSX2 core.</p></div><button class="secondary" data-action="about">About</button></div></div></div></section>`}
function render(focus=false){syncSettings();$('#main').innerHTML=page==='home'?home():page==='library'?library():page==='details'?details():page==='playlists'?playlistPage():settings();$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#background').innerHTML=art(current(),true);$('#background').style.opacity=['home','details'].includes(page)?'1':'.25';if(focus)($('#main .primary')||$('#main button'))?.focus()}

function showModal(content,kind='dialog'){if(!modal)returnFocus=document.activeElement;modal=kind;$('#layers').innerHTML=`<div class="overlay"><section class="dialog ${kind}" role="dialog" aria-modal="true" aria-label="Library dialog"><button class="icon close" data-action="close" aria-label="Close">✕</button>${content}</section></div>`;queueMicrotask(()=>($('#layers input')||$('#layers button:not(.close)')||$('#layers .close'))?.focus())}

function startAnimation(){if(prefs.startup===false)return;const reduced=prefs.reduced||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;if(reduced)return;const logo=$('.brand svg')?.outerHTML;if(!logo)return;startupActive=true;$('.app').setAttribute('inert','');const el=document.createElement('div');el.id='startup';el.className='splash';el.setAttribute('role','dialog');el.setAttribute('aria-label','Welcome to Black Ice');el.innerHTML=logo+'<strong>BLACK ICE</strong><small>YOUR GAMES. YOUR SPACE.</small><button data-action="skipstartup">Skip animation</button>';document.body.appendChild(el);el.querySelector('button').focus();setTimeout(finishStartup,1300)}

const actions={bios:()=>AndroidLibrary.openBios(),skipstartup:finishStartup,sounds:()=>{soundOn=!soundOn;AndroidLibrary.setSoundsEnabled(soundOn);render();$('[data-action="sounds"]')?.focus()},ambient:()=>{prefs.ambient=prefs.ambient===false;persist();applyMotion();render();$('[data-action="ambient"]')?.focus()},startup:()=>{prefs.startup=prefs.startup===false;persist();render();$('[data-action="startup"]')?.focus()},newplaylist:()=>namePlaylist(),saveplaylist:()=>savePlaylist(),renameplaylist:()=>namePlaylist(true),saverename:()=>savePlaylist(true),editplaylist:editPlaylist,membership:membership,doneplaylist:()=>{closeModal();render(true)},allplaylists:()=>{activePlaylist=null;go("playlists")},deleteplaylist:()=>{const p=playlistById();if(p)showModal(`<h2>Delete ${esc(p.name)}?</h2><p>Your games and original files stay in the library.</p><div class="actions"><button class="secondary" data-action="close">Cancel</button><button class="primary" data-action="confirmdeleteplaylist">Delete playlist</button></div>`)},confirmdeleteplaylist:()=>{playlists=playlists.filter(p=>p.id!==activePlaylist);activePlaylist=null;persist();go("playlists");toast("Playlist deleted.")},theme:()=>{themeOn=!themeOn;AndroidLibrary.setThemeEnabled(themeOn);$$('[data-action="theme"]').forEach(el=>{el.setAttribute('aria-pressed',String(themeOn));if(el.getAttribute('role')==='switch')el.setAttribute('aria-checked',String(themeOn))})},tracking:()=>AndroidLibrary.enableTracking(),autoinfo:()=>{infoAuto=!infoAuto;AndroidLibrary.setAutomaticInfo(infoAuto);$('[data-action="autoinfo"]')?.setAttribute('aria-checked',String(infoAuto))},downloadinfo:()=>{AndroidLibrary.downloadInfo();toast('Updating GameDB-PS2 information…')},infosource:()=>{const g=current();if(g?.coverSerial)AndroidLibrary.openInfoSource(g.id);else toast('Match this game’s serial first.')},downloadcovers:()=>{AndroidLibrary.downloadCovers();toast('Looking for missing covers…')},autocovers:()=>{autoCovers=!autoCovers;AndroidLibrary.setAutomaticCovers(autoCovers);$('[data-action="autocovers"]')?.setAttribute('aria-checked',String(autoCovers))},choosecover:()=>{const g=current();if(!g)return;closeModal();AndroidLibrary.chooseCover(g.id)},add:()=>{closeModal();if(window.AndroidLibrary)AndroidLibrary.chooseGames();else toast('File selection is available in the Android APK.')},play:()=>{const g=current();if(!g){actions.add();return}closeModal();AndroidLibrary.play(g.id)},emulator:()=>AndroidLibrary.openEmulator(),search,context,close:closeModal,favorite:()=>{const g=current();if(!g)return;favorites.has(g.id)?favorites.delete(g.id):favorites.add(g.id);persist();if(modal)context();else render(true)},remove:()=>{const g=current();if(!g)return;showModal(`<h2>Remove ${esc(g.title)}?</h2><p>This removes the library entry. Your original file stays on your device.</p><div class="actions"><button class="secondary" data-action="close">Cancel</button><button class="primary" data-remove="${g.id}">Remove entry</button></div>`)},motion:()=>{prefs.reduced=!prefs.reduced;persist();document.body.classList.toggle('reduced',!!prefs.reduced);render();$('[data-action="motion"]')?.focus()},keyboard:()=>{$('#keyboard').innerHTML=$('#keyboard').innerHTML?'':`<div class="keyboard">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('').concat(['Space','⌫','Clear','Done']).map(k=>`<button data-key="${k}">${k}</button>`).join('')}</div>`;$('#keyboard button')?.focus()},about:()=>showModal('<h2>Black Ice</h2><p>Your own game files, in a controller-friendly library. Select files with Add Games, then use Play.</p><p>This app includes the ARMSX2 / PCSX2 emulator core. Import a BIOS dumped from your PS2 in Emulator setup. Game settings, controls and save states are available in the built-in emulation screen. Compatibility depends on the core and your device.</p><p>No example games or fabricated playtime are included. Cards show filenames and sizes from Android’s file picker; covers download from xlenore/ps2-covers. Unmatched games keep a neutral fallback.</p><p>Core: ARMSX2 / PCSX2, GPL-3.0-or-later. Source and notices accompany the build. Cover source: github.com/xlenore/ps2-covers. Only the game serial is requested from the cover server; game files stay on your device.</p><p>Submerged Meridian uses your supplied recording and plays only on the Home screen. Built-in VM playtime tracking stores per-game totals locally without Usage Access. Game descriptions are factual summaries of GameDB-PS2 metadata, not plot synopses.</p><p>UI effects: user-supplied Black Ice UI movement pack. Playlists are stored on this device. Removing a playlist does not remove your games.</p><p>Arrow keys / D-pad: navigate · Cross / Enter: select · Circle / Escape: back · Triangle / T: options · L1/R1 or Q/E: Home / Library.</p><div class="actions"><button class="primary" data-action="add">Add Games</button><button class="secondary" data-action="emulator">Emulator setup</button></div>')};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(startupActive){finishStartup();return}if(b.dataset.action!=='sounds')sound(b.dataset.action==='close'?'back':'click');if(b.dataset.playlist){activePlaylist=+b.dataset.playlist;go('playlists');return}if(b.dataset.member){const p=playlistById();toggleMember(p,+b.dataset.member);const on=p.games.includes(+b.dataset.member);b.setAttribute('aria-pressed',String(on));b.querySelector('b').textContent=on?'✓':'＋';return}if(b.dataset.membership){const p=playlistById(+b.dataset.membership);toggleMember(p,current().id);const on=p.games.includes(current().id);b.setAttribute('aria-pressed',String(on));b.querySelector('b').textContent=on?'✓':'＋';return}if(b.dataset.action)actions[b.dataset.action]?.();else if(b.dataset.page)go(b.dataset.page);else if(b.dataset.game){selected=+b.dataset.game;go('details')}else if(b.dataset.filter){filter=b.dataset.filter;render();$(`[data-filter="${filter}"]`)?.focus()}else if(b.dataset.remove){AndroidLibrary.remove(+b.dataset.remove);closeModal()}else if(b.dataset.key){const k=b.dataset.key,i=$('#query');if(k==='Done'){i.focus();return}i.value=k==='Clear'?'':k==='⌫'?i.value.slice(0,-1):i.value+(k==='Space'?' ':k);searchResults()}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){sort=e.target.value;prefs.sort=sort;persist();render();$('#sort').focus()}});
document.addEventListener('input',e=>{if(e.target.id==='query')searchResults();if(e.target.id==='music-volume'){sound('slider');musicVolume=+e.target.value;$('#volume-value').textContent=musicVolume+'%';AndroidLibrary.setThemeVolume(musicVolume)}});
document.addEventListener('focusin',e=>{const b=e.target.closest('[data-game]');if(b&&!modal){selected=+b.dataset.game;$$('.game').forEach(x=>x.classList.toggle('selected',+x.dataset.game===selected));if(page==='home'){$('.hero').outerHTML=hero(current());$('#background').innerHTML=art(current(),true)}b.scrollIntoView({block:'nearest',inline:'nearest',behavior:prefs.reduced?'auto':'smooth'})}});
function focusables(){return [...(modal?$('#layers'):document).querySelectorAll('button,input,select')].filter(el=>el.getClientRects().length&&!el.disabled)}
function direction(dir){const els=focusables(),cur=document.activeElement;if(!els.includes(cur)){els[0]?.focus();return}const r=cur.getBoundingClientRect(),cx=r.x+r.width/2,cy=r.y+r.height/2;let best=null,score=Infinity;for(const el of els){if(el===cur)continue;const a=el.getBoundingClientRect(),dx=a.x+a.width/2-cx,dy=a.y+a.height/2-cy,major=dir==='right'?dx:dir==='left'?-dx:dir==='down'?dy:-dy,minor=Math.abs(dir==='right'||dir==='left'?dy:dx);if(major>5){const s=major+minor*3;if(s<score){score=s;best=el}}}if(best){sound(dir==='left'||dir==='right'?'horizontal':'move');best.focus()}else sound('boundary')}
window.androidControl=function(action){if(startupActive){finishStartup();return}if(['up','down','left','right'].includes(action))return direction(action);if(action==='select'){const el=document.activeElement;if(el?.tagName==='SELECT'){el.selectedIndex=(el.selectedIndex+1)%el.options.length;el.dispatchEvent(new Event('change',{bubbles:true}))}else el?.click()}else if(action==='back')back();else if(action==='context'||action==='menu')context();else if(action==='details'&&!modal&&games.length)go('details');else if((action==='home'||action==='library')&&!modal)go(action)};
document.addEventListener('keydown',e=>{if(startupActive){e.preventDefault();finishStartup();return}if(e.key==='Enter'&&e.target.id==='playlist-name'){e.preventDefault();const rename=$('#layers [data-action="saverename"]');savePlaylist(!!rename);return}if(e.key==='Tab'&&modal){const els=focusables(),i=els.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();els.at(-1)?.focus()}else if(!e.shiftKey&&i===els.length-1){e.preventDefault();els[0]?.focus()}return}if(e.key==='Escape'){e.preventDefault();back();return}if(['INPUT','SELECT'].includes(e.target.tagName))return;const dirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(dirs[e.key]){e.preventDefault();direction(dirs[e.key]);return}if(!modal&&(e.key==='q'||e.key==='e'))go(e.key==='q'?'home':'library');if(e.key==='t')context();if(e.key==='x'&&!modal&&games.length)go('details');if(e.key==='/'){e.preventDefault();search()}});
function clock(){$('#clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,30000);applyMotion();window.refreshLibrary();startAnimation();queueMicrotask(()=>{if(!startupActive)($('#main .primary')||$('#main button'))?.focus()});
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('background-paused',document.hidden));
</script>
<style>
.ambient::before,.ambient::after{content:"";position:absolute;inset:-15%;pointer-events:none;will-change:transform;animation:meridian-drift 28s ease-in-out infinite alternate;background:radial-gradient(ellipse at 25% 65%,#4199b51c,transparent 48%),radial-gradient(ellipse at 80% 20%,#588bff16,transparent 45%)}
.ambient::after{background:radial-gradient(circle at 15% 30%,#aadfff55 1px,transparent 2px),radial-gradient(circle at 75% 60%,#aadfff44 1px,transparent 2px);background-size:150px 180px,230px 210px;animation-duration:40s;opacity:.4}
button{transition:transform .18s var(--ease),background-color .18s,border-color .18s}
button:active{transform:scale(.97)}
@keyframes meridian-drift{from{transform:translate3d(-2%,1%,0) rotate(-3deg)}to{transform:translate3d(3%,-3%,0) rotate(4deg)}}
.reduced .ambient::before,.reduced .ambient::after,.background-paused .ambient::before,.background-paused .ambient::after{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.ambient::before,.ambient::after{animation:none!important}button{transition:none!important}}
</style>
